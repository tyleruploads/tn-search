<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>TN Search</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>TN Search</h1>
    <div id="div-search">
        <select id="engineSelect">
            <option disabled class="select-header">- The Classics -</option>

            <option data-url="https://google.com/search?q={query}">Google</option>
            <option data-url="https://bing.com/search?q={query}">Bing</option>
            <option data-url="https://search.yahoo.com/search?q={query}">Yahoo</option>


            <option disabled class="select-header">- Privacy -</option>

            <option data-url="https://duckduckgo.com/search?q={query}" selected>DuckDuckGo</option>
            <option data-url="https://startpage.com/search?q={query}">Startpage</option>
            <option data-url="https://search.brave.com/search?q={query}">Brave</option>
            <option data-url="https://www.mojeek.com/search?q={query}">Mojeek</option>
            <option data-url="https://www.qwant.com/?q={query}">Qwant</option>
            <option data-url="https://www.ecosia.org/search?q={query}">Ecosia</option>
            <option data-url="https://swisscows.com/en/web?query={query}">Swisscows</option>
            <option data-url="https://librex.rlp.schule/search.php?q={query}">LibreX</option>

            <option disabled class="select-header">- AI -</option>

            <option data-url="https://www.perplexity.ai/search/new?q={query}">Perplexity AI</option>
            <option data-url="https://chatgpt.com/?q={query}">ChatGPT</option>


            <option disabled class="select-header">- Tools -</option>

            <option disabled class="select-header">- Code -</option>

            <option data-category="tool" data-url="https://github.com/search?type=code&q={query}">GitHub Code</option>
            <option data-category="tool" data-url="https://gitlab.com/search?search={query}">GitLab Code</option>
            <option data-category="tool" data-url="https://codeberg.org/explore/repos?q={query}">Codeberg</option>
            <option data-category="tool" data-url="https://stackoverflow.com/search?q={query}">Stack Overflow</option>
            <option data-category="tool" data-url="https://codepen.io/search?q={query}">CodePen</option>


            <option disabled class="select-header">- Academic & Research -</option>

           <option data-category="tool" data-url="https://scholar.google.com/scholar?q={query}">Google Scholar</option>
           <option data-category="tool" data-url="https://www.semanticscholar.org/search?q={query}">Semantic Scholar</option>
           <option data-category="tool" data-url="https://arxiv.org/search/?query={query}&searchtype=all&abstracts=show&order=-announced_date_first&size=50">arXiv</option>
           <option data-category="tool" data-url="https://pubmed.ncbi.nlm.nih.gov/?term={query}">NIH PubMed</option>
           <option data-category="tool" data-url="https://www.crossref.org/site-search/?query={query}">Crossref</option>

           <option disabled class="select-header">- Encyclopedia -</option>

           <option data-category="tool" data-url="https://en.wikipedia.org/w/index.php?search={query}&title=Special:Search&profile=advanced&fulltext=1">Wikipedia</option>
           <option data-category="tool" data-url="https://en.wiktionary.org/w/index.php?search={query}&title=Special%253ASearch&profile=advanced&fulltext=1">Wiktionary</option>
           <option data-category="tool" data-url="https://www.wikidata.org/w/index.php?search={query}&language=en&title=Special%253ASearch">Wikidata</option>
           <option data-category="tool" data-url="https://www.britannica.com/search?query={query}">Britannica</option>


            <option disabled class="select-header">- Packages -</option>

            <option data-category="tool" data-url="https://repology.org/projects/?search={query}">Repology</option>
            <option data-category="tool" data-url="https://pkgs.org/search/?q={query}">Linux Packages</option>
            <option data-category="tool" data-url="https://community.chocolatey.org/packages?q={query}">chocolatey</option>
            <option data-category="tool" data-url="https://pypi.org/search/?q={query}">PyPI</option>
            <option data-category="tool" data-url="https://www.npmjs.com/search?q={query}">npm</option>
            <option data-category="tool" data-url="https://crates.io/search?q={query}">crates</option>
            <option data-category="tool" data-url="https://rubygems.org/search?query={query}">RubyGems</option>
            <option data-category="tool" data-url="https://www.nuget.org/packages?q={query}">NuGet</option>
            <option data-category="tool" data-url="https://packagist.org/search/?query={query}">Packagist</option>
            <option data-category="tool" data-url="https://mvnrepository.com/search?q={query}">Maven Repository</option>
            <option data-category="tool" data-url="https://pkg.go.dev/search?q={query}">pkg.go.dev</option>
            <option data-category="tool" data-url="https://pub.dev/packages?q={query}">pub.dev</option>
            <option data-category="tool" data-url="https://search.r-project.org/?P={query}">R Packages</option>
            <option data-category="tool" data-url="https://metacpan.org/search?q={query}">MetaCPAN</option>

            <option disabled class="select-header">- Documentation -</option>

            <option data-category="tool" data-url="https://devdocs.io/#q={query}">DevDocs</option>
            <option data-category="tool" data-url="https://developer.mozilla.org/en-US/search?q={query}">MDN Docs</option>
            <option data-category="tool" data-url="https://learn.microsoft.com/en-us/search/?terms={query}">Microsoft Learn</option>
            <option data-category="tool" data-url="https://www.die.net/search/#gsc.q={query}">Linux man Pages</option>
            <option data-category="tool" data-url="https://docs.python.org/3/search.html?q={query}">Python3</option>
            <option data-category="tool" data-url="https://doc.rust-lang.org/stable/std/index.html?search={query}">Rust Stable</option>
            <option data-category="tool" data-url="https://docs.oracle.com/search/?q={query}&category=java">Java</option>

            <option disabled class="select-header">- Containers & DevOps -</option>

            <option data-category="tool" data-url="https://hub.docker.com/search?q={query}">Docker Hub</option> 
            <option data-category="tool" data-url="https://artifacthub.io/packages/search?ts_query_web={query}">Artifact Hub</option>

            <option disabled class="select-header">- Domains & Networking -</option>
    
            <option data-category="tool" data-url="https://www.godaddy.com/whois/results.aspx?domain={query}">WHOIS Lookup</option>
            <option data-category="tool" data-url="https://www.nslookup.io/ip/{query}/domain-names/">Reverse DNS</option> 

            <option disabled class="select-header">- Cybersecurity -</option>

            <option data-category="tool" data-url="https://www.virustotal.com/gui/search?query={query}">VirusTotal</option>
            <option data-category="tool" data-url="https://www.shodan.io/search?query={query}">Shodan</option> 
        </select>
        <input id="input-search">
        <button id="button-search">Search</button>
    </div>

    <footer>
        <p>Copyright (c) 2026 Tyler N. <https://github.com/tyleruploads></p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
